volumes:
  istad-oracle-vol:
    driver: local

networks:
  ite-net:
    external: true

services:
  # ─────────────────────────────────────────────
  #  Oracle XE 21c – Source database for CDC
  #  LogMiner requires ARCHIVELOG mode (enabled by
  #  the Oracle XE image automatically)
  # ─────────────────────────────────────────────
  istad-oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: istad-oracle
    hostname: istad-oracle
    ports:
      - "1521:1521"       # JDBC / SQL*Net
      - "5500:5500"       # Oracle Enterprise Manager Express
    environment:
      ORACLE_PASSWORD: Oracle123          # SYS / SYSTEM password
      APP_USER: appuser                  # application user created in XEPDB1
      APP_USER_PASSWORD: apppass
    volumes:
      - istad-oracle-vol:/opt/oracle/oradata
      - ./init_db:/container-entrypoint-initdb.d  # run on first boot
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/Oracle123@localhost:1521/XEPDB1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - ite-net
    shm_size: 1g
