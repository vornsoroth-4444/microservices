server:
  port: 9899

spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-orders/**
              filters:
                - RewritePath=/my-orders/?(?<segment>.*), /$\{segment}
            - id: json-placeholder
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/jph/**
              filters:
                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
            - id: frontend
              uri: http://localhost:3000
              predicates:
                - Path=/**
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        service-name: gateway-server
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:39000
      client:
        provider:
          iam-service:
            issuer-uri: http://localhost:39000
        registration:
          front-bff-client:
            provider: iam-service
            client-id: front-bff-client
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/front-bff-client"
            scope:
              - openid
              - profile


#actuator:
management:
  endpoints:
    web:
      exposure:
        include: "health,gateway"
  endpoint:
    gateway:
      access: read_only