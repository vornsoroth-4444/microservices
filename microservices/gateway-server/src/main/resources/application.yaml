server:
  port: 9899

spring:
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: my-order-service
              uri: lb://order-service
              predicates:
                - Path=/my-orders/**
              filters:
                - RewritePath=/my-orders/?(?<segment>.*), /$\{segment}
#            - id: json-placeholder
#              uri: https://jsonplaceholder.typicode.com
#              predicates:
#                - Path=/jph/**
#              filters:
#                - RewritePath=/jph/?(?<segment>.*), /$\{segment}
            - id: docs
              uri: https://localhost:3001
              predicates:
                - Path=/**
            - id: web
              uri: https://localhost:3000
              predicates:
                - Path=/**
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        service-name: gateway-server
        instance-id: ${spring.application.name}-${random.value}
#        prefer-ip-address: true

#actuator:
management:
  endpoints:
    web:
      exposure:
        include: "health,gateway"
  endpoint:
    gateway:
      access: read_only