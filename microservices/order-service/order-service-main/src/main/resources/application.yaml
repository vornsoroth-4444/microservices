server:
  port: 9092

spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - "optional:consul:"

  cloud:
    consul:
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          customer-client:
            client-id: customer-client
            client-secret: secret
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope:
              - read
              - write
        provider:
          customer-client:
            token-uri: http://localhost:9000/oauth2/token
            issuer-uri: http://localhost:9000

service:
  customer:
    base-url: http://customer-service
  business:
    base-url: http://business-service
