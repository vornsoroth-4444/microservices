server:
  port: 9092
  forward-headers-strategy: framework

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:39000


  application:
    name: order-service
  profiles:
    active: dev
  config:
    import:
      - "optional:consul:"

  cloud:
    consul:
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver


