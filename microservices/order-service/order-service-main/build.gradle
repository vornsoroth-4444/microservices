plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {

    implementation 'kh.edu.istad:order-domain-core'
    implementation 'kh.edu.istad:order-service-client'
    implementation 'kh.edu.istad:order-application-service'
    implementation 'kh.edu.istad:order-service-persistence'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}