pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            url 'https://buf.build/gen/maven'
        }
    }
    versionCatalogs {
        libs{
            from(
                    files("../../gradle/libs.versions.toml")
            )
        }
    }
}

rootProject.name = 'customer-service'

include 'customer-service-main'
include 'customer-service-domain:customer-domain-core'
include 'customer-service-domain:customer-application-service'
include 'customer-service-restapi'
include 'customer-service-persistence'
include 'customer-service-message'
include 'customer-service-grpc'