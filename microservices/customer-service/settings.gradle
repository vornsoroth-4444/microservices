pluginManagement {
    includeBuild('../../build-logic')

    repositories {
        maven {
            name = 'NexusProxy'
            url = uri("${providers.gradleProperty('nexus.url').getOrElse('http://localhost:28081')}/repository/maven-public/")
            allowInsecureProtocol = true
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven {
            name = 'NexusPublic'
            url = uri("${providers.gradleProperty('nexus.url').getOrElse('http://localhost:28081')}/repository/maven-public/")
            allowInsecureProtocol = true
            credentials {
                username = providers.gradleProperty('nexus.username').orNull ?: System.getenv('NEXUS_USERNAME') ?: 'admin'
                password = providers.gradleProperty('nexus.password').orNull ?: System.getenv('NEXUS_PASSWORD') ?: 'vornsoroth'
            }
        }
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files("../../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = 'customer-service'

include 'customer-service-main'
include 'customer-service-domain:customer-domain-core'
include 'customer-service-domain:customer-application-service'
include 'customer-service-restapi'
include 'customer-service-persistence'
include 'customer-service-message'