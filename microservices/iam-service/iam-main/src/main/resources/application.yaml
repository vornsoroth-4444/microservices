server:
  port: 9000
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: iam-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9543/db_oauth2}
    username: ${SPRING_DATASOURCE_USERNAME:iteuser}
    password: ${SPRING_DATASOURCE_PASSWORD:qwerqwer}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      authorizationserver:
        issuer: ${OAUTH2_ISSUER:http://localhost:9000}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: openid, profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret}
            scope: read:user, user:email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:facebook-client-secret}
            scope: public_profile, email

gg:
  jte:
    template-location: src/main/jte
    development-mode: true

logging:
  level:
    root: INFO
    kh.edu.istad.platform.iam: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
