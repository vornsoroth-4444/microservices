plugins {
    id 'spring-boot-common-conventions'
}

sourceSets {
    main {
        resources {
            srcDirs += ['src/main/jte']
        }
    }
}

dependencies {
    implementation project(':iam-domain:iam-domain-core')
    implementation project(':iam-domain:iam-application-service')
    implementation project(':iam-persistence')
    implementation project(':iam-infrastructure')
    implementation project(':iam-rest-api')
    implementation project(':iam-web')

    implementation 'gg.jte:jte:3.2.4'
    implementation 'gg.jte:jte-spring-boot-starter-3:3.2.4'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
