
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0e7ff, #f3e8ff);
            padding: 20px;
        }

        main {
            width: 950px;
            min-height: 550px;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        /* LEFT SECTION */
        .left {
            width: 50%;
            background: linear-gradient(135deg, #4776e6, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px;
            color: white;
            text-align: center;
        }

        .left h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 16px;
            line-height: 1.8;
            color: #eeeeff;
        }

        .left i {
            font-size: 65px;
            margin-bottom: 30px;
        }

        /* RIGHT SECTION */
        .right {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 45px;
        }

        form {
            width: 100%;
        }

        form h2 {
            text-align: center;
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 35px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #444;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 22px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            background: #fafafa;
        }

        input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #4776e6, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(102, 126, 234, 0.3);
        }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin: 25px 0;
            color: #aaa;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        /* SOCIAL LOGIN */
        .social-login {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .social-btn {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .github {
            background: #24292f;
            color: white;
            border-color: #24292f;
        }

        .github:hover {
            background: #000;
            transform: translateY(-2px);
        }

        .google {
            background: white;
            color: #444;
        }

        .google:hover {
            background: #f5f5f5;
            border-color: #4285f4;
            transform: translateY(-2px);
        }

        .social-btn i {
            font-size: 18px;
        }

        /* FOOTER */
        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
            text-align: center;
        }

        /* RESPONSIVE */
        @media (max-width: 750px) {
            main {
                width: 100%;
                max-width: 450px;
                flex-direction: column;
            }

            .left {
                width: 100%;
                min-height: 190px;
                padding: 25px;
            }

            .left h1 {
                font-size: 28px;
            }

            .left i {
                font-size: 35px;
                margin-bottom: 12px;
            }

            .right {
                width: 100%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

<main>

    <!-- LEFT SECTION -->
    <div class="left">
        <div>
            <i class="fas fa-user-circle"></i>
            <h1>Welcome Back!</h1>
            <p>
                We're glad to see you again.
                Sign in to access your account
                and continue your journey.
            </p>
        </div>
    </div>

    <!-- RIGHT SECTION -->
    <div class="right">

        <form action="/login" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <h2>Login</h2>
            <p class="subtitle">Enter your account details</p>

            <label for="username">Username</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
            >

            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
            >

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i>
                Login
            </button>

        </form>

        <!-- DIVIDER -->
        <div class="divider">OR CONTINUE WITH</div>

        <!-- SOCIAL LOGIN -->
        <div class="social-login">

            <a href="/oauth2/authorization/github"
               class="social-btn github">
                <i class="fab fa-github"></i>
                Continue with GitHub
            </a>

            <a href="/oauth2/authorization/google"
               class="social-btn google">
                <i class="fab fa-google"></i>
                Continue with Google

            </a>

        </div>

        <div class="footer">
            &copy; 2026 Your Application. All rights reserved.
        </div>

    </div>

</main>

</body>
</html>
